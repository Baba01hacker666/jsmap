[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jsmap"
version = "0.2.0"
description = "JavaScript asset analyzer with source-map recovery and security reporting"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "jsmap contributors"}]
keywords = ["javascript", "source-maps", "security", "analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["requests>=2.28", "urllib3>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.2", "twine>=5.0"]

[project.scripts]
jsmap = "jsmap.cli:main"

[project.urls]
Homepage = "https://github.com/Baba01hacker666/jsmap"
Repository = "https://github.com/Baba01hacker666/jsmap"

[tool.hatch.build.targets.wheel]
packages = ["src/jsmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
